[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "specoracle"
version = "0.1.0"
description = "Evaluation pipeline for informal specs as in-context oracles in secure program synthesis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "SpecOracle Contributors" }
]
dependencies = [
  "openai>=1.0",
  "pytest>=8.0",
  "scipy>=1.13",
  "pyyaml>=6.0",
  "radon>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.49"]
dev = [
  "ruff>=0.8",
]

[project.scripts]
specoracle = "specoracle.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["artifacts", "runs"]
